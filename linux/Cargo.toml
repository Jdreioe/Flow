[package]
name = "flow-linux"
version.workspace = true
edition.workspace = true
description = "Flow selected-text reader for Linux"
license.workspace = true

[dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["global_shortcuts", "tokio"] }
atspi-common = "0.14.0"
atspi-connection = { version = "0.14.0", default-features = false }
atspi-proxies = "0.14.0"
base64 = "0.22"
cpp = "0.5.10"
cstr = "0.2"
directories = "6"
futures-util = "0.3"
flow-core = { path = "../core" }
keyring = "4.1.6"
qmetaobject = { version = "0.2.10", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssip-client-async = "0.19.0"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-stream = "0.1"
unicode-segmentation = "1.12"
uuid = { version = "1", features = ["serde", "v4"] }
wl-clipboard-rs = "0.9.3"
x11-clipboard = "0.9.3"

[build-dependencies]
cpp_build = "0.5.10"
