[package]
name = "flow-windows"
version.workspace = true
edition.workspace = true
description = "Flow selected-text reader for Windows"
license.workspace = true

[[bin]]
name = "flow-windows"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
cpp = "0.5.10"
cstr = "0.2"
directories = "6"
flow-core = { path = "../core" }
keyring = "4.1.6"
qmetaobject = { version = "0.2.10", default-features = false }
qttypes = "0.2.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
velopack = "1.2"
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Core",
    "Media_Playback",
    "Media_SpeechSynthesis",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
cpp_build = "0.5.10"
winresource = "0.1"
