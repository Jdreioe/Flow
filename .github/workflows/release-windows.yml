name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release candidate version, e.g. 0.2.0"
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: pwsh

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@v2

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          arch: win64_msvc2022_64
          cache: true

      - name: Build flow-windows (release)
        run: cargo build --release --locked --package flow-windows

      - name: Install vpk
        run: dotnet tool update -g vpk

      - name: Package Velopack release
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/package-velopack.ps1

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:VERSION"
          $notes = @"
          Flow $tag for Windows.

          Install with the attached Flow-win-Setup.exe. No certificate import
          or sideloading settings are needed. Windows may show a SmartScreen
          notice on first run; choose "More info" and then "Run anyway".
          Installed builds update themselves from the tray menu (Check for
          Updates).
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
          # releases.win.json must ship with every release: the in-app feed
          # points at releases/latest/download/releases.win.json, which only
          # resolves for full (non-prerelease) releases.
          gh release create "$tag" `
            --repo "$env:GITHUB_REPOSITORY" `
            --title "Flow $tag (Windows)" `
            --notes-file $notesPath `
            (Get-ChildItem "dist/Releases" -File | ForEach-Object FullName)
